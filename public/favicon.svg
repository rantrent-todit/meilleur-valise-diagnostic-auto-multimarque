<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Dégradé principal de fond diagonal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="60%" stop-color="#00006f" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Lueur subtile accent au sommet -->
    <radialGradient id="topGlow" cx="25%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#1e40af" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ombre douce sous le glyphe -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Ombre générale du squircle -->
    <filter id="boxShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#090d16" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fond Squircle Moderne Style iOS / macOS (rayon 56px) -->
  <rect 
    x="12" 
    y="12" 
    width="232" 
    height="232" 
    rx="56" 
    ry="56" 
    fill="url(#bgGrad)" 
    filter="url(#boxShadow)"
  />

  <!-- Halo de lumière chaude supérieure -->
  <rect 
    x="12" 
    y="12" 
    width="232" 
    height="232" 
    rx="56" 
    ry="56" 
    fill="url(#topGlow)" 
  />

  <!-- Liseré intérieur biseauté (Glass border) -->
  <rect 
    x="14" 
    y="14" 
    width="228" 
    height="228" 
    rx="54" 
    ry="54" 
    fill="none" 
    stroke="rgba(255, 255, 255, 0.22)" 
    stroke-width="3" 
  />

  <!-- Éléments vectoriels de la thématique -->
  <g filter="url(#softShadow)">
    
    <g transform="translate(128, 128) scale(1.12) translate(-128, -128)">
      <!-- Câble OBD supérieur -->
      <path d="M128 34 L128 48 M112 34 L144 34" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" />
      <!-- Boîtier robuste de la valise diagnostic -->
      <rect x="46" y="48" width="164" height="172" rx="20" fill="rgba(255,255,255,0.16)" stroke="#ffffff" stroke-width="12" />
      <!-- Renforts d'angle antichoc en caoutchouc -->
      <path d="M46 72 L46 56 C46 51 51 48 56 48 L72 48" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" />
      <path d="M210 72 L210 56 C210 51 205 48 200 48 L184 48" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" />
      <path d="M46 196 L46 212 C46 217 51 220 56 220 L72 220" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" />
      <path d="M210 196 L210 212 C210 217 205 220 200 220 L184 220" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" />
      <!-- Écran LCD haute résolution -->
      <rect x="64" y="66" width="128" height="84" rx="10" fill="#09131f" stroke="#ffffff" stroke-width="6" />
      <!-- Onde ECG / Diagnostic moteur en direct -->
      <path d="M72 108 L94 108 L104 88 L116 128 L128 98 L138 114 L146 108 L184 108" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Icône moteur / check engine discret au sommet de l'écran -->
      <circle cx="80" cy="80" r="4" fill="#ef4444" />
      <circle cx="94" cy="80" r="4" fill="#fbbf24" />
      <!-- Clavier de navigation & Touches de validation -->
      <circle cx="92" cy="184" r="14" fill="rgba(255,255,255,0.25)" stroke="#ffffff" stroke-width="4" />
      <rect x="132" y="172" width="22" height="24" rx="6" fill="#38bdf8" />
      <rect x="162" y="172" width="22" height="24" rx="6" fill="#ef4444" />
    </g>
  
  </g>
</svg>